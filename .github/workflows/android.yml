name: Android-app

on:
  push:
    branches: [main, "claude/android-app-*"]
    paths: ["app/**", "src/**", "build.sh", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time, so an older build never overwrites a newer APK on the release
concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kopiér spillet ind i appen
        working-directory: app
        run: npm ci && npm run sync
      - name: Byg test-APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk ../../Pismarie.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pismarie-apk
          path: Pismarie.apk
      - name: Læg APK'en på siden "Pismarie Android-test"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --target "$GITHUB_SHA" --title "Pismarie Android-test" --notes "Test-app til Android. Hent Pismarie.apk nedenfor på telefonen og installér den."
          gh release upload android-test Pismarie.apk --clobber
          gh release edit android-test --notes "Test-app til Android, bygget $(date -u +%Y-%m-%d) (version 1.0.$VERSION_CODE). Hent Pismarie.apk nedenfor på telefonen og installér den."

      # Signed AAB for Google Play, only once the upload-key secrets have been added to the repo
      - name: Byg AAB til Play Butik
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        working-directory: app/android
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.keystore" ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab ../../Pismarie.aab
      - if: ${{ hashFiles('Pismarie.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Pismarie-aab
          path: Pismarie.aab
